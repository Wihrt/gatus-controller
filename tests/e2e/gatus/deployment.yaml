# Real Gatus instance used by the e2e tests to prove that Gatus accepts the
# configuration generated by the controller.
#
# The version placeholder is substituted by tests/e2e/setup.sh (GATUS_VERSION).
# The Deployment starts with 0 replicas: at setup time the controller-managed
# ConfigMap only holds placeholder values, which Gatus would reject at startup.
# The Chainsaw test 08-real-gatus scales it up once the config is generated.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: gatus
  labels:
    app.kubernetes.io/name: gatus
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: gatus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gatus
    spec:
      containers:
        - name: gatus
          image: ghcr.io/twin/gatus:__GATUS_VERSION__
          env:
            # Directory mode: every *.yaml file of the ConfigMap is deep-merged
            # (config/config.go in Gatus). No subPath, so ConfigMap updates are
            # projected into the pod.
            - name: GATUS_CONFIG_PATH
              value: /config
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: gatus-config
